<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ROOMTONE</title>
<style>
  /* Fonts are bundled, not fetched. A visualizer should not need the network
     to draw a frame, and it should not tell a font CDN when you open it. */
  @font-face { font-family:'Space Grotesk'; font-weight:400; font-display:block;
    src:url('fonts/SpaceGrotesk-400.woff2') format('woff2'); }
  @font-face { font-family:'Space Grotesk'; font-weight:500; font-display:block;
    src:url('fonts/SpaceGrotesk-500.woff2') format('woff2'); }
  @font-face { font-family:'Space Grotesk'; font-weight:700; font-display:block;
    src:url('fonts/SpaceGrotesk-700.woff2') format('woff2'); }
  @font-face { font-family:'Space Mono'; font-weight:400; font-display:block;
    src:url('fonts/SpaceMono-400.woff2') format('woff2'); }
  @font-face { font-family:'Space Mono'; font-weight:700; font-display:block;
    src:url('fonts/SpaceMono-700.woff2') format('woff2'); }
  @font-face { font-family:'Anton'; font-weight:400; font-display:block;
    src:url('fonts/Anton-400.woff2') format('woff2'); }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;overflow:hidden}

  /* Dragging a slider used to sweep a text selection across the whole window.
     Nothing here is prose, so nothing is selectable — except the credits,
     where copying a repo name is the point. */
  body{-webkit-user-select:none;user-select:none}
  [data-selectable],[data-selectable] *{-webkit-user-select:text;user-select:text}
  input[type=range]{cursor:grab}
  input[type=range]:active{cursor:grabbing}
  a{color:#b7a4ff;text-decoration:none}
  a:hover{color:#fff}
  @keyframes rtdrift{0%{transform:translate3d(-2%,-1%,0) scale(1.06)}50%{transform:translate3d(2%,2%,0) scale(1.12)}100%{transform:translate3d(-2%,-1%,0) scale(1.06)}}

  /* Overlays arrive rather than appear: the backdrop fades, the content rises
     into place behind it. 300ms — long enough to read as motion, short enough
     that it never feels like waiting. */
  @keyframes rtenter{from{opacity:0}to{opacity:1}}
  @keyframes rtleave{from{opacity:1}to{opacity:0}}
  @keyframes rtleavedown{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px)}}
  @keyframes rtrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* Scrollbars, so a scrolling panel does not tear a light stripe through a
     black interface. */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:6px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22);background-clip:content-box}
</style>
</head>
<body>
<template id="app-template">
<div data-r="root" data-ref="rootRef" style="position:fixed;inset:0;background:#000;color:#fff;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;overflow:hidden;text-wrap:pretty">

  <div data-if="isOnboard" style="display:contents">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:48px;overflow-y:auto">
      <div style="position:fixed;inset:0;background:radial-gradient(130% 90% at 50% 118%, rgba(124,92,255,0.22), transparent 66%);pointer-events:none"></div>
      <div style="position:relative;width:100%;max-width:660px;margin:auto;flex:none;display:flex;flex-direction:column;gap:38px">

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:baseline;gap:14px">
            <div style="font-size:38px;font-weight:700;letter-spacing:0.18em;line-height:1">ROOMTONE</div>
            <div style="width:9px;height:9px;border-radius:50%;background:var(--a,#7c5cff);box-shadow:0 0 18px var(--a,#7c5cff)"></div>
          </div>
          <div data-r="verline" style="font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:0.22em;color:#9d98a6">AUDIO-REACTIVE ROOM LIGHTING · WIN64</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:26px">

          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:center;gap:14px">
              <div style="font-family:'Space Mono',monospace;font-size:11px;color:#9d98a6;letter-spacing:0.14em">01</div>
              <div style="font-size:15px;font-weight:500;letter-spacing:0.02em">Metadata source</div>
              <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.12em;padding:3px 8px;border-radius:4px;border:1px solid rgba(45,226,150,0.4);color:#2de296">PREMIUM REQUIRED</div>
            </div>
            <div data-if="spotifyOn" style="display:contents">
              <div style="display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid rgba(45,226,150,0.35);background:rgba(45,226,150,0.07);border-radius:10px">
                <div style="width:8px;height:8px;border-radius:50%;background:#2de296;box-shadow:0 0 12px #2de296"></div>
                <div style="font-size:14px">Spotify connected</div>
                <div style="margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:#a5a0ad">PREMIUM · TRACK + TIMED LYRICS</div>
              </div>
            </div>
            <div data-if="spotifyOff" style="display:contents">
              <button type="button" data-on-click="connect" style="display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);border-radius:10px;color:#fff;font-family:inherit;font-size:14px;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.28)">
                <div style="width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.35)"></div>
                <div>Connect Spotify Premium</div>
                <div style="margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:#9d98a6">OAUTH →</div>
              </button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:center;gap:14px">
              <div style="font-family:'Space Mono',monospace;font-size:11px;color:#9d98a6;letter-spacing:0.14em">02</div>
              <div style="font-size:15px;font-weight:500;letter-spacing:0.02em">Audio capture</div>
              <div style="font-family:'Space Mono',monospace;font-size:10.5px;color:#8f8a99;letter-spacing:0.1em">WASAPI LOOPBACK</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
              <div data-for="devices" data-as="d" style="display:contents">
                <button type="button" data-r="chip" data-g="device" data-v="{{ d.v }}" data-on-click="d.on" style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02);border-radius:10px;color:#b0abb8;font-family:inherit;cursor:pointer;text-align:left">
                  <div style="font-size:13px;font-weight:500">{{ d.label }}</div>
                  <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;opacity:0.6">{{ d.sub }}</div>
                </button>
              </div>
            </div>

            <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.2em;color:var(--a,#7c5cff)">OR JUST ONE APP</div>
              <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
              <button type="button" data-on-click="refreshApps" style="padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:rgba(255,255,255,0.5);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;cursor:pointer" style-hover="color:#fff;border-color:#fff">REFRESH</button>
            </div>

            <div data-if="hasApps" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
              <div data-for="appSources" data-as="a" style="display:contents">
                <button type="button" data-r="chip" data-g="source" data-v="{{ a.v }}" data-on-click="a.on" style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02);border-radius:10px;color:#b0abb8;font-family:inherit;cursor:pointer;text-align:left">
                  <div style="font-size:13px;font-weight:500">{{ a.label }}</div>
                  <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;opacity:0.6">{{ a.sub }}</div>
                </button>
              </div>
            </div>
            <div data-if="noApps" style="font-size:11px;line-height:1.6;color:#8f8a99">Nothing has an audio session right now. Start playing something and press REFRESH.</div>
            <div style="font-size:10.5px;line-height:1.6;color:#8f8a99">Capturing one app takes its audio before it reaches the speaker mix, so notifications and game sound do not land in the visual. Needs Windows 10 build 20348 or newer; anything older falls back to the whole output.</div>
          </div>

          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:center;gap:14px">
              <div style="font-family:'Space Mono',monospace;font-size:11px;color:#9d98a6;letter-spacing:0.14em">03</div>
              <div style="font-size:15px;font-weight:500;letter-spacing:0.02em">Output display</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div data-for="targets" data-as="t" style="display:contents">
                <button type="button" data-r="chip" data-g="target" data-v="{{ t.v }}" data-on-click="t.on" style="display:flex;align-items:flex-end;gap:14px;padding:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02);border-radius:10px;color:#b0abb8;font-family:inherit;cursor:pointer;text-align:left">
                  <div style="display:flex;flex-direction:column;gap:6px">
                    <div style="font-size:13px;font-weight:500">{{ t.label }}</div>
                    <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;opacity:0.6">{{ t.sub }}</div>
                  </div>
                  <div style="margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;color:var(--a,#7c5cff)">{{ t.mode }}</div>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:16px">
          <button type="button" data-r="launch" data-on-click="launch" style="padding:18px;border-radius:10px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.04);color:#9d98a6;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:0.16em;cursor:default">START VISUALIZER</button>
          <div style="font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8f8a99">Spotify Premium is required — playback control is a Premium-only API. Auth is local: tokens are stored in Windows Credential Manager and never leave this machine. Loopback capture stays local; nothing is uploaded.</div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid rgba(255,255,255,0.07);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#8f8a99">
            <div>BUILT BY ROBIN</div>
            <button type="button" data-on-click="openCredits" style="border:0;background:transparent;padding:0;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#a5a0ad;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.2)" style-hover="color:#fff;border-color:#fff">CREDITS →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div data-if="isClub" style="display:contents">
    <div data-r="playerFrame" style="position:absolute;inset:0;overflow:hidden;transition:right 0.42s cubic-bezier(0.2,0.9,0.2,1)">

      <div data-r="bloom" style="position:absolute;inset:-14%;opacity:0;pointer-events:none;filter:blur(90px) saturate(1.5);animation:rtdrift 26s ease-in-out infinite">
        <div style="position:absolute;inset:0;background:radial-gradient(45% 45% at 42% 40%, var(--a,#7c5cff) 0%, transparent 68%),radial-gradient(50% 50% at 62% 64%, var(--a2,#2a1160) 0%, transparent 70%),radial-gradient(30% 30% at 74% 26%, #ffffff 0%, transparent 60%)"></div>
      </div>

      <div data-r="edge" style="position:absolute;top:0;left:0;right:0;height:26vh;transform-origin:top center;background:linear-gradient(to bottom, var(--a,#7c5cff), transparent 82%);opacity:0;pointer-events:none;filter:blur(26px)"></div>
      <div data-r="edge" style="position:absolute;top:0;bottom:0;right:0;width:20vw;transform-origin:right center;background:linear-gradient(to left, var(--a,#7c5cff), transparent 82%);opacity:0;pointer-events:none;filter:blur(26px)"></div>
      <div data-r="edge" style="position:absolute;bottom:0;left:0;right:0;height:26vh;transform-origin:bottom center;background:linear-gradient(to top, var(--a,#7c5cff), transparent 82%);opacity:0;pointer-events:none;filter:blur(26px)"></div>
      <div data-r="edge" style="position:absolute;top:0;bottom:0;left:0;width:20vw;transform-origin:left center;background:linear-gradient(to right, var(--a,#7c5cff), transparent 82%);opacity:0;pointer-events:none;filter:blur(26px)"></div>

      <div data-r="barsRow" style="position:absolute;left:0;right:0;bottom:0;height:34vh;display:flex;align-items:flex-end;gap:3px;padding:0 4vw;opacity:0;pointer-events:none">
        <div data-for="bars" data-as="b" style="display:contents">
          <div data-r="bar" style="flex:1;height:2%;border-radius:2px 2px 0 0;background:linear-gradient(to top, var(--a,#7c5cff), rgba(255,255,255,0.9));opacity:0.3"></div>
        </div>
      </div>

      <canvas data-r="flowCanvas" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none"></canvas>

      <div data-r="specLayer" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none">
        <div data-r="specRing" style="position:relative;width:min(64vh,64vw);height:min(64vh,64vw)">
          <div data-r="specHalo" style="position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;border:1px solid rgba(255,255,255,0.14)"></div>
          <div data-for="specBars" data-as="b" style="display:contents">
            <div data-r="sbar" style="position:absolute;left:50%;top:50%;width:3px;height:8%;transform-origin:50% 0;background:linear-gradient(to bottom, rgba(255,255,255,0.95), var(--a,#7c5cff));border-radius:2px"></div>
          </div>
        </div>
      </div>

      <div data-r="lyrLayer" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.4vh;opacity:0;pointer-events:none">
        <div data-for="slots" data-as="s" style="display:contents">
          <div data-r="word" style="font-size:3vw;font-weight:700;letter-spacing:-0.03em;line-height:0.98;text-align:center;white-space:nowrap"></div>
        </div>
      </div>

      <div data-r="editLayer" style="position:absolute;inset:0;opacity:0;pointer-events:none;overflow:hidden;background:#07060c">
        <div data-r="editArt" style="position:absolute;inset:-8%;background:linear-gradient(135deg, var(--a2,#2a1160) 0%, var(--a,#7c5cff) 52%, #120a24 100%);animation:rtdrift 30s ease-in-out infinite"></div>
        <div data-r="editArtTex" style="position:absolute;inset:-8%;background:repeating-linear-gradient(118deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 13px);mix-blend-mode:overlay"></div>
        <div data-r="editBg" style="position:absolute;inset:0;background:var(--a,#7c5cff);mix-blend-mode:color;opacity:0.62"></div>
        <div style="position:absolute;inset:0;background:radial-gradient(115% 85% at 50% 42%, transparent 30%, rgba(4,3,8,0.62) 78%, rgba(4,3,8,0.9) 100%)"></div>
        <div data-r="editScan" style="position:absolute;inset:0;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);opacity:0.5"></div>

        <div data-r="editStage" style="position:absolute;inset:0">
          <div data-r="editStack" style="position:absolute;display:flex;flex-direction:column;gap:0.06em">
            <div data-for="editRows" data-as="r" style="display:contents">
              <div data-r="erow" style="font-family:'Anton',Impact,sans-serif;font-size:5vw;line-height:0.9;text-transform:uppercase;white-space:nowrap;color:#fff;align-self:flex-start"></div>
            </div>
          </div>
        </div>

        <div data-for="echoes" data-as="e" style="display:contents">
          <div data-r="echo" style="position:absolute;left:0;top:0;font-family:'Space Mono',monospace;font-weight:700;font-size:0.85vw;letter-spacing:0.24em;text-transform:uppercase;color:rgba(255,255,255,0.9);white-space:nowrap;opacity:0"></div>
        </div>

        <div data-r="editMeta" style="position:absolute;left:4.2vw;top:12vh;display:flex;flex-direction:column;gap:5px;opacity:0.9">
          <div data-r="title" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.3em;color:rgba(255,255,255,0.92);text-transform:uppercase"></div>
          <div data-r="artist" style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:rgba(255,255,255,0.55);text-transform:uppercase"></div>
        </div>
      </div>

      <div data-r="nolyr" style="position:absolute;left:0;right:0;bottom:26px;text-align:center;opacity:0;pointer-events:none">
        <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.28em;color:rgba(255,255,255,0.34)">NO SYNCED LYRICS · ART BLOOM</div>
      </div>

      <div data-r="idleTag" style="position:absolute;left:50%;transform:translateX(-50%);bottom:130px;display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,0.10);background:rgba(7,5,13,0.7);opacity:0;pointer-events:none;transition:opacity 0.6s ease">
        <div style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.35)"></div>
        <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:rgba(255,255,255,0.42)">PAUSED · VISUALS AT REST</div>
      </div>

      <div data-r="stageWrap" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:118px 0 158px;pointer-events:none">
        <div data-r="stage" style="display:flex;flex-direction:column;align-items:center;gap:26px;pointer-events:auto;transition:transform 0.65s cubic-bezier(0.2,0.9,0.2,1),opacity 0.5s ease">

          <div data-r="cover" data-on-click="toggleLyrics" style="position:relative;width:min(340px,28vh);height:min(340px,28vh);border-radius:6px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg, var(--a2,#2a1160) 0%, var(--a,#7c5cff) 58%, #08040f 100%);box-shadow:0 40px 120px rgba(0,0,0,0.7)">
            <div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,0.055) 0 2px, transparent 2px 9px)"></div>
            <div data-r="ring" style="position:absolute;left:50%;top:50%;width:56%;height:56%;margin:-28% 0 0 -28%;border-radius:50%;border:1px solid rgba(0,0,0,0.42);box-shadow:inset 0 0 0 22px rgba(255,255,255,0.05)"></div>
            <div style="position:absolute;left:50%;top:50%;width:13%;height:13%;margin:-6.5% 0 0 -6.5%;border-radius:50%;background:#08040f"></div>
            <div style="position:absolute;left:16px;bottom:14px;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.2em;color:rgba(255,255,255,0.55)" data-r="coverTag">COVER ART · FROM API</div>
          </div>

          <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
            <div data-r="title" style="font-size:30px;font-weight:700;letter-spacing:0.04em">VELA</div>
            <div data-r="artist" style="font-size:14px;color:rgba(255,255,255,0.55);letter-spacing:0.06em">Nightcast</div>
          </div>

          <div data-r="chrome" style="display:flex;flex-direction:column;align-items:center;gap:20px;transition:opacity 0.4s ease">
            <div style="display:flex;align-items:center;gap:12px;width:420px">
              <div data-r="tcur" style="font-family:'Space Mono',monospace;font-size:10.5px;color:rgba(255,255,255,0.45);width:34px">0:00</div>
              <div style="flex:1;height:2px;background:rgba(255,255,255,0.14);border-radius:2px;overflow:hidden">
                <div data-r="prog" style="height:100%;width:0%;background:#fff;box-shadow:0 0 10px var(--a,#7c5cff)"></div>
              </div>
              <div data-r="tdur" style="font-family:'Space Mono',monospace;font-size:10.5px;color:rgba(255,255,255,0.45);width:34px;text-align:right">3:47</div>
            </div>

            <div style="display:flex;align-items:center;gap:26px">
              <button type="button" data-on-click="prev" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;cursor:pointer;padding:0">
                <div style="width:0;height:0;border-style:solid;border-width:7px 10px 7px 0;border-color:transparent rgba(255,255,255,0.7) transparent transparent"></div>
                <div style="width:2px;height:14px;background:rgba(255,255,255,0.7)"></div>
              </button>
              <button type="button" data-on-click="toggle" style="width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer" style-hover="background:rgba(255,255,255,0.14)">
                <div data-if="playing" style="display:contents">
                  <div style="display:flex;gap:5px">
                    <div style="width:4px;height:17px;background:#fff"></div>
                    <div style="width:4px;height:17px;background:#fff"></div>
                  </div>
                </div>
                <div data-if="paused" style="display:contents">
                  <div style="width:0;height:0;margin-left:4px;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff"></div>
                </div>
              </button>

            <div style="width:2px;height:10px;background:rgba(255,255,255,0.7)"></div>
          </button>
          <button type="button" data-on-click="toggle" style="width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(255,255,255,0.14)">
            <div data-if="playing" style="display:contents">
              <div style="display:flex;gap:4px">
                <div style="width:3px;height:12px;background:#fff"></div>
                <div style="width:3px;height:12px;background:#fff"></div>
              </div>
            </div>
            <div data-if="paused" style="display:contents">
              <div style="width:0;height:0;margin-left:3px;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #fff"></div>
            </div>
          </button>
          <button type="button" data-on-click="next" style="display:flex;align-items:center;gap:2px;border:0;background:transparent;cursor:pointer;padding:6px">
            <div style="width:2px;height:10px;background:rgba(255,255,255,0.7)"></div>
            <div style="width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent rgba(255,255,255,0.7)"></div>
          </button>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08)">
          <button type="button" data-on-click="closeTray" style="padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:rgba(255,255,255,0.6);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.16em;cursor:pointer" style-hover="color:#fff;border-color:#fff">OPEN FULL WINDOW</button>
        </div>
      </div>

    </div>
  </div>

  <div data-if="showDebug" style="display:contents">
    <div data-r="dbgPanel" data-v="debug" style="animation:rtrise 0.28s cubic-bezier(0.2,0.9,0.2,1) both;position:absolute;z-index:52;top:130px;left:20px;width:238px;display:flex;flex-direction:column;gap:0;border:1px solid rgba(255,255,255,0.12);border-radius:9px;background:rgba(4,3,8,0.93);backdrop-filter:blur(10px);overflow-y:auto;font-family:'Space Mono',monospace">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.10)">
        <div style="font-size:9px;letter-spacing:0.2em;color:rgba(255,255,255,0.75)">DIAGNOSTICS</div>
        <button type="button" data-on-click="closeDebug" style="border:0;background:transparent;padding:0;font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer" style-hover="color:#fff">×</button>
      </div>
      <div data-for="debugRows" data-as="d" style="display:contents">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,0.05)">
          <div style="font-size:9px;letter-spacing:0.1em;color:#9d98a6">{{ d.k }}</div>
          <div data-r="dbg" data-k="{{ d.id }}" style="font-size:10.5px;color:rgba(255,255,255,0.9)">—</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;padding:11px 12px">
        <div data-for="bandMeters" data-as="b" style="display:contents">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="font-size:8.5px;letter-spacing:0.1em;color:#9d98a6;width:30px">{{ b.k }}</div>
            <div style="flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,0.10);overflow:hidden">
              <div data-r="meter" data-k="{{ b.id }}" style="height:100%;width:0%;background:var(--a,#7c5cff)"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div data-if="showLyrics" style="display:contents">
    <div data-r="ovl" data-v="lyrics" style="animation:rtenter 0.30s ease both;position:absolute;inset:0;z-index:45;background:#050308;display:flex;flex-direction:column">
      <div data-r="lyrBloom" style="position:absolute;inset:-12%;opacity:0.22;pointer-events:none;filter:blur(120px) saturate(1.3);animation:rtdrift 38s ease-in-out infinite">
        <div style="position:absolute;inset:0;background:radial-gradient(38% 42% at 30% 30%, var(--a,#7c5cff) 0%, transparent 68%),radial-gradient(40% 40% at 72% 74%, var(--a2,#2a1160) 0%, transparent 70%)"></div>
      </div>

      <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 34px;border-bottom:1px solid rgba(255,255,255,0.08)">
        <div style="display:flex;align-items:center;gap:14px;min-width:0">
          <div data-r="cover" style="width:40px;height:40px;flex:none;border-radius:4px;overflow:hidden;position:relative;background:linear-gradient(135deg, var(--a2,#2a1160) 0%, var(--a,#7c5cff) 58%, #08040f 100%)"></div>
          <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
            <div data-r="title" style="font-size:14px;font-weight:500;letter-spacing:0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">VELA</div>
            <div data-r="artist" style="font-size:11px;color:rgba(255,255,255,0.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Nightcast</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:#8f8a99;white-space:nowrap">LRCLIB · CLICK A LINE TO SEEK</div>
          <button type="button" data-on-click="closeLyrics" style="width:30px;height:30px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,0.16);background:transparent;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer" style-hover="color:#fff;border-color:#fff">×</button>
        </div>
      </div>

      <div style="position:absolute;inset:0;background:rgba(5,3,8,0.62);pointer-events:none"></div>

      <div data-r="lyrScroll" style="position:relative;flex:1;overflow-y:auto;padding:28vh 8vw">
        <div data-if="hasLyrics" style="display:contents">
          <div style="display:flex;flex-direction:column;gap:4px;max-width:780px;margin:0 auto">
            <div data-for="lyricLines" data-as="l" style="display:contents">
              <div data-r="lyrLine" data-i="{{ l.i }}" data-on-click="l.on" style="display:flex;align-items:baseline;gap:18px;padding:9px 14px;border-radius:8px;cursor:pointer;transition:background 0.2s ease" style-hover="background:rgba(255,255,255,0.05)">
                <div data-r="lyrTime" style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,0.22);width:36px;flex:none;padding-top:6px">{{ l.time }}</div>
                <div data-r="lyrText" style="font-size:27px;font-weight:500;letter-spacing:-0.015em;line-height:1.3;color:#9d98a6">{{ l.text }}</div>
              </div>
            </div>
          </div>
        </div>
        <div data-if="noLyrics" style="display:contents">
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
            <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.24em;color:rgba(255,255,255,0.4)">NO SYNCED LYRICS FOUND</div>
            <div style="font-size:13px;line-height:1.6;color:rgba(255,255,255,0.32);max-width:380px">LRCLIB has no timed entry for this track. Coverage is good for popular music and thin elsewhere, so the visualizer falls back to art bloom — which is a designed state, not an error.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div data-if="showTour" style="display:contents">
    <div data-r="ovl" data-v="tour" style="animation:rtenter 0.30s ease both;position:absolute;inset:0;z-index:48;background:rgba(3,2,6,0.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:40px">
      <div style="width:100%;max-width:460px;display:flex;flex-direction:column;gap:26px;padding:32px;border:1px solid rgba(255,255,255,0.10);border-radius:16px;background:rgba(9,6,15,0.95);box-shadow:0 40px 110px rgba(0,0,0,0.6)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
          <div data-r="tourNum" style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--a,#7c5cff)">01 / 04</div>
          <button type="button" data-on-click="endTour" style="border:0;background:transparent;padding:0;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;color:rgba(255,255,255,0.35);cursor:pointer" style-hover="color:#fff">SKIP</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:11px">
          <div data-r="tourTitle" style="font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.2"></div>
          <div data-r="tourBody" style="font-size:13.5px;line-height:1.65;color:#b0abb8"></div>
          <div data-r="tourKeys" style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#8f8a99;padding-top:4px"></div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
          <div style="display:flex;gap:6px">
            <div data-for="tourDots" data-as="d" style="display:contents">
              <div data-r="tdot" data-i="{{ d.i }}" style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.18)"></div>
            </div>
          </div>
          <button type="button" data-r="tourNext" data-on-click="nextTour" style="padding:12px 24px;border-radius:8px;border:0;background:#fff;color:#0a0510;font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.16em;cursor:pointer">NEXT</button>
        </div>
      </div>
    </div>
  </div>

  <div data-if="showCredits" style="display:contents">
    <div data-r="ovl" data-v="credits" style="animation:rtenter 0.30s ease both;position:absolute;inset:0;z-index:50;background:#040208;display:flex;flex-direction:column;padding:48px;overflow-y:auto">
      <div data-selectable style="width:100%;max-width:760px;margin:auto;flex:none;display:flex;flex-direction:column;gap:30px;animation:rtrise 0.44s cubic-bezier(0.2,0.9,0.2,1) both">

        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:24px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="font-size:24px;font-weight:700;letter-spacing:0.14em">CREDITS</div>
            <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;color:rgba(255,255,255,0.38)">ROOMTONE IS BUILT ON THESE PROJECTS</div>
          </div>
          <button type="button" data-on-click="closeCredits" style="flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,0.18);background:transparent;color:rgba(255,255,255,0.6);font-family:'Space Mono',monospace;font-size:14px;cursor:pointer" style-hover="color:#fff;border-color:#fff">×</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(255,255,255,0.10)">
          <div data-for="credits" data-as="c" style="display:contents">
            <div style="display:grid;grid-template-columns:150px 1fr 150px;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.07)">
              <div style="font-size:14px;font-weight:500;letter-spacing:0.02em">{{ c.name }}</div>
              <div style="font-size:11.5px;line-height:1.5;color:rgba(255,255,255,0.48)">{{ c.role }}</div>
              <a href="{{ c.url }}" data-on-click="c.open" rel="noopener" style="font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.06em;color:var(--a,#7c5cff);text-align:right;border:0" style-hover="color:#fff">{{ c.repo }}</a>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;padding:18px 20px;border:1px solid rgba(255,255,255,0.10);border-radius:10px;background:rgba(255,255,255,0.02)">
          <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.18em;color:rgba(255,255,255,0.35)">LICENCE</div>
          <div style="font-size:12px;line-height:1.65;color:rgba(255,255,255,0.62)">ROOMTONE is released under the GNU General Public License v3, because it links aubio for beat detection. The source is public and any fork must stay open under the same terms.</div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:6px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;color:rgba(255,255,255,0.3)">
          <div>BUILT BY ROBIN</div>
          <div style="color:rgba(255,255,255,0.2)">GPL-3.0</div>
        </div>
      </div>
    </div>
  </div>

</div>

</x-dc>

</template>
<script type="module" src="app.js"></script>
</body>
</html>
